<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kenya Shipyards Limited - Contact Information</title>
  <style>
    :root {
      --text: #111111;
      --muted: #5b5b5b;
      --line: #c9c9c9;
      --bg: #ffffff;
    }
    html, body {
      margin: 0;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }
    .page {
      width: 1080px;
      min-height: 1350px;
      margin: 0 auto;
      background: white;
      position: relative;
      box-sizing: border-box;
      padding: 48px 90px 40px;
    }
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }
    .logo {
      width: 330px;
      height: auto;
      display: block;
    }
    h1 {
      margin: 24px 0 0;
      text-align: center;
      font-size: 56px;
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    h2 {
      margin: 14px 0 0;
      text-align: center;
      font-size: 30px;
      font-weight: 400;
      color: #111;
    }
    .divider {
      margin: 24px auto 48px;
      border-top: 3px solid var(--line);
      width: 100%;
    }
    .details {
      margin-top: 22px;
      display: grid;
      grid-template-columns: 210px 1fr;
      row-gap: 28px;
      column-gap: 10px;
      align-items: start;
      font-size: 28px;
      line-height: 1.28;
    }
    .label {
      font-weight: 700;
    }
    .value {
      font-weight: 400;
      word-break: break-word;
    }
    .note {
      text-align: center;
      margin-top: 92px;
      font-size: 22px;
      color: var(--muted);
    }
    .footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 26px;
      text-align: center;
      font-size: 22px;
      color: #7b7b7b;
    }
    @media print {
      .page {
        margin: 0;
        width: 1080px;
        min-height: 1350px;
      }
    }
  </style>
</head>
